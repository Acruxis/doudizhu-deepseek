[game]
; AI 难度：easy / medium / hard
difficulty = medium

; 是否用大模型驱动「困难」级 AI（需联网 + 可用的 OpenAI 兼容接口；失败自动回退内置AI）
ai_enabled = false

; OpenAI 兼容接口的 API Key（示例占位；「困难」级 AI 启用时才用到）
api_key = apikey

; 接口地址（OpenAI 兼容 /v1 形式）
base_url = https://api.deepseek.com

; 模型名
model = deepseek-v4-flash

player_name = 玩家
